[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "brkas"
dynamic = ["version"]
description = "kas-like YAML project files for Buildroot"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.10"
dependencies = ["PyYAML"]

[project.optional-dependencies]
schema = ["jsonschema"]

[project.scripts]
brkas = "brkas.cli:main"
brkas-container = "brkas.container:main"

[tool.setuptools]
packages = ["brkas"]

[tool.setuptools.dynamic]
version = {attr = "brkas.__version__"}

[tool.setuptools.data-files]
"share/man/man1" = ["brkas.1", "brkas-container.1"]

[tool.setuptools.package-data]
brkas = ["schema.json", "container/Dockerfile", "container/brkas.sh"]
