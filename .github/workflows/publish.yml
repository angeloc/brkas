# Publishes brkas on PyPI when a version tag, such as 0.1.0, is pushed.
#
# It uses PyPI trusted publishing, so no password or token is stored here.
# PyPI must know this workflow first: in the PyPI settings of the project,
# add a trusted publisher with the repository angeloc/brkas, the workflow
# publish.yml and the environment pypi.
name: Publish on PyPI

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check that the tag is the version of the package
        run: |
          version=$(python -c "import brkas; print(brkas.__version__)")
          echo "tag $GITHUB_REF_NAME, package version $version"
          test "$version" = "$GITHUB_REF_NAME"
      - name: Run the unit tests
        run: |
          python -m pip install pyyaml jsonschema pytest
          python -m pytest tests/test_config.py
      - name: Build the source archive and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write   # lets PyPI check that the upload comes from this workflow
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
