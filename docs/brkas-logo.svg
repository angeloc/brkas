<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="392" viewBox="24 4 1016 392">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d47a1" flood-opacity="0.55"/>
    </filter>
    <filter id="textshadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d47a1" flood-opacity="0.55"/>
    </filter>
    <filter id="tagshadow" x="-10%" y="-50%" width="120%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0d47a1" flood-opacity="0.5"/>
    </filter>
    <mask id="wrenchmask" maskUnits="userSpaceOnUse" x="-40" y="-40" width="360" height="360">
      <rect x="-40" y="-40" width="360" height="360" fill="#fff"/>
      <rect x="129" y="14" width="22" height="40" rx="3" fill="#000" transform="rotate(-15 140 52)"/>
    </mask>
    <clipPath id="hat">
      <path d="M84 188 V170 C84 131 108 104 140 104 C172 104 196 131 196 170 V188 Z"/>
      <rect x="127" y="94" width="26" height="94" rx="8"/>
      <rect x="62" y="182" width="156" height="24" rx="12"/>
    </clipPath>
  </defs>

  <!-- Buildroot blue (Material Blue 500) -->
  <rect x="24" y="4" width="1016" height="392" rx="36" fill="#2196f3"/>

  <g transform="translate(80,60)">
    <!-- tile: Material Amber -->
    <rect width="280" height="280" rx="56" fill="#ffb300" filter="url(#shadow)"/>

    <!-- wrench: open jaw top right -->
    <g transform="rotate(45 140 146)" fill="#263238" mask="url(#wrenchmask)">
      <circle cx="140" cy="52" r="28"/>
      <rect x="129" y="66" width="22" height="210" rx="11"/>
    </g>

    <!-- hammer: head top left -->
    <g transform="rotate(-45 140 146)" fill="#263238">
      <rect x="131" y="56" width="18" height="216" rx="9"/>
      <rect x="129" y="206" width="22" height="70" rx="11"/>
      <rect x="104" y="30" width="18" height="40" rx="5"/>
      <rect x="116" y="35" width="50" height="30" rx="3"/>
      <path d="M162 35 L190 44 Q194 46 194 50 Q194 54 190 56 L162 65 Z"/>
    </g>

    <!-- hard hat, front view: one amber outline around it, to stand off the tools -->
    <g stroke="#ffb300" stroke-width="18" stroke-linejoin="round" fill="#ffb300">
      <path d="M84 188 V170 C84 131 108 104 140 104 C172 104 196 131 196 170 V188 Z"/>
      <rect x="127" y="94" width="26" height="94" rx="8"/>
      <rect x="62" y="182" width="156" height="24" rx="12"/>
    </g>
    <g fill="#ffffff">
      <path d="M84 188 V170 C84 131 108 104 140 104 C172 104 196 131 196 170 V188 Z"/>
      <rect x="127" y="94" width="26" height="94" rx="8"/>
      <rect x="62" y="182" width="156" height="24" rx="12"/>
    </g>
    <g clip-path="url(#hat)">
      <rect x="127" y="94" width="26" height="90" fill="#cfd8dc"/>
      <rect x="62" y="198" width="156" height="8" fill="#cfd8dc"/>
      <rect x="140" y="90" width="90" height="120" fill="#263238" opacity="0.08"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="410" y="236" font-family="Noto Sans Display, DejaVu Sans, sans-serif"
        font-size="168" font-weight="900" letter-spacing="6" filter="url(#textshadow)">
    <tspan fill="#ffc107">BR</tspan><tspan fill="#ffffff">KAS</tspan>
  </text>
  <text x="416" y="296" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace"
        font-size="30" fill="#e3f2fd" letter-spacing="1" filter="url(#tagshadow)">Making Buildroot projects easy</text>
</svg>
